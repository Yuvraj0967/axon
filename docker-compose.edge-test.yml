services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./backend/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge-test
    depends_on:
      - mosquitto
    environment:
      BROKER_IP: mosquitto
      MACHINE_ID: ${MACHINE_ID:-M1}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-1}
    cpus: ${EDGE_CPU_QUOTA:-4.0}
    cpuset: ${EDGE_CPUSET:-0-3}
    mem_limit: ${EDGE_MEMORY_LIMIT:-2048m}
    pids_limit: ${EDGE_PIDS_LIMIT:-192}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
